{% extends "base.html" %}

{% block title %}
Login | AI Career Copilot
{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-glow"></div>

    <div class="authentication-container reveal">

        <div class="auth-icon">
            🔐
        </div>

        <span class="section-label">
            AI CAREER COPILOT
        </span>

        <h1>
            Welcome Back
        </h1>

        <p class="sub-text">
            Login to continue your career journey.
        </p>


        <form
            method="POST"
            action="{{ url_for('login') }}"
        >

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                🔐 Login
            </button>

        </form>


        <p class="auth-bottom">

            Don't have an account?

            <a href="{{ url_for('signup') }}">
                Create Account
            </a>

        </p>

    </div>

</section>

{% endblock %}
