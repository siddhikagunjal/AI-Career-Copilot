{% extends "base.html" %}

{% block title %}
Sign Up | AI Career Copilot
{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-glow"></div>

    <div class="authentication-container reveal">

        <div class="auth-icon">
            🚀
        </div>

        <span class="section-label">
            AI CAREER COPILOT
        </span>

        <h1>
            Create Account
        </h1>

        <p class="sub-text">
            Start your AI-powered career journey.
        </p>


        <form
            method="POST"
            action="{{ url_for('signup') }}"
        >

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                🚀 Create Account
            </button>

        </form>


        <p class="auth-bottom">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</section>

{% endblock %}
